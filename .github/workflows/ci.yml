name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "opencode_demo"

jobs:

  # ============================================================
  # LINT & TYPE CHECK
  # ============================================================

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  # ============================================================
  # AWS OIDC TEST
  # ============================================================

  aws-auth:
    name: Test AWS OIDC Authentication
    runs-on: ubuntu-latest

    needs: [lint]

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ 
            github.ref == 'refs/heads/main' && 
            'arn:aws:iam::043083732273:role/GitHubProductionDeployRole' || 
            'arn:aws:iam::547107369872:role/GitHubStagingDeployRole'
            }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}"


  # ============================================================
  # SUPABASE EDGE FUNCTIONS
  # ============================================================
 #
  # deploy-supabase-functions:
  #   name: Deploy Supabase Functions
  #   runs-on: ubuntu-latest

  #   needs: [lint]

  #  if: github.ref == 'refs/heads/main'  || github.ref == 'refs/heads/dev'

  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4

  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #         cache: npm

  #     - name: Install dependencies
  #       run: npm ci

  #   - name: Deploy Supabase Functions
  #       run: npx supabase functions deploy --project-ref "${{ env.SUPABASE_PROJECT_REF }}"
  #       env:
  #         SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  #         SUPABASE_PROJECT_REF: ${{ 
  #           github.ref == 'refs/heads/main' && 
  #           vars.SUPABASE_PROJECT_REF_PRODUCTION || 
  #           vars.SUPABASE_PROJECT_REF_STAGING }}


  # ============================================================
  # DOCKER BUILD & PUSH - STAGING
  # ============================================================

  docker-build-staging:
    name: Docker Build & Push - Staging
    runs-on: ubuntu-latest

    needs:
      - lint
      - aws-auth


    if: github.ref == 'refs/heads/dev'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::547107369872:role/GitHubStagingDeployRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t opencode_demo:${{ github.sha }} \
            -t opencode_demo:staging-latest \
            .

      - name: Tag Docker image
        run: |
          docker tag \
            opencode_demo:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/opencode_demo:${{ github.sha }}

          docker tag \
            opencode_demo:staging-latest \
            ${{ steps.login-ecr.outputs.registry }}/opencode_demo:staging-latest

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/opencode_demo:${{ github.sha }}

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/opencode_demo:staging-latest