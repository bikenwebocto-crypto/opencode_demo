name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "employee_perk_platform"

jobs:

  # ============================================================
  # LINT & TYPE CHECK
  # ============================================================

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  # ============================================================
  # AWS OIDC TEST
  # ============================================================

  aws-auth:
    name: Test AWS OIDC Authentication
    runs-on: ubuntu-latest

    needs: [lint]

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ 
            github.ref == 'refs/heads/main' && 
            'arn:aws:iam::043083732273:role/GitHubProductionDeployRole' || 
            'arn:aws:iam::547107369872:role/GitHubStagingDeployRole'
            }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}"


  # ============================================================
  # SUPABASE EDGE FUNCTIONS
  # ============================================================
 #
  # deploy-supabase-functions:
  #   name: Deploy Supabase Functions
  #   runs-on: ubuntu-latest

  #   needs: [lint]

  #  if: github.ref == 'refs/heads/main'  || github.ref == 'refs/heads/dev'

  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4

  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #         cache: npm

  #     - name: Install dependencies
  #       run: npm ci

  #   - name: Deploy Supabase Functions
  #       run: npx supabase functions deploy --project-ref "${{ env.SUPABASE_PROJECT_REF }}"
  #       env:
  #         SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  #         SUPABASE_PROJECT_REF: ${{ 
  #           github.ref == 'refs/heads/main' && 
  #           vars.SUPABASE_PROJECT_REF_PRODUCTION || 
  #           vars.SUPABASE_PROJECT_REF_STAGING }}


          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:staging-latest"
  
  # ============================================================
  # DOCKER BUILD & PUSH - STAGING
  # ============================================================

  docker-build-staging:
    name: Docker Build & Push - Staging
    runs-on: ubuntu-latest

    needs:
      - lint
      - aws-auth


    if: github.ref == 'refs/heads/dev'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::547107369872:role/GitHubStagingDeployRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          secrets: |
            database_url=${{ secrets.STAGING_DATABASE_URL }}
            next_public_supabase_url=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            next_public_supabase_publishable_key=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            next_public_app_url=${{ secrets.NEXT_PUBLIC_APP_URL }}
            next_public_google_maps_api_key=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            next_public_google_maps_map_id=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
            next_public_firebase_api_key=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            next_public_firebase_auth_domain=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            next_public_firebase_project_id=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            next_public_firebase_storage_bucket=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            next_public_firebase_messaging_sender_id=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            next_public_firebase_app_id=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            next_public_firebase_measurement_id=${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
            next_public_firebase_vapid_key=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        run: |
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
  # ============================================================
  # DOCKER BUILD & PUSH - PRODUCTION
  # ============================================================

  docker-build-production:
    name: Docker Build & Push - Production
    runs-on: ubuntu-latest

    needs:
      - lint
      - aws-auth

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::043083732273:role/GitHubProductionDeployRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/bikenwebocto-crypto/emp-perk-platform:production-latest
            ${{ steps.login-ecr.outputs.registry }}/bikenwebocto-crypto/emp-perk-platform:${{ github.sha }}
          secrets: |
            database_url=${{ secrets.PRODUCTION_DATABASE_URL }}
            next_public_supabase_url=${{ secrets.PRODUCTION_NEXT_PUBLIC_SUPABASE_URL }}
            next_public_supabase_publishable_key=${{ secrets.PRODUCTION_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            next_public_app_url=${{ secrets.PRODUCTION_NEXT_PUBLIC_APP_URL }}
            next_public_google_maps_api_key=${{ secrets.PRODUCTION_NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            next_public_google_maps_map_id=${{ secrets.PRODUCTION_NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
            next_public_firebase_api_key=${{ secrets.PRODUCTION_NEXT_PUBLIC_FIREBASE_API_KEY }}
            next_public_firebase_auth_domain=${{ secrets.PRODUCTION_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            next_public_firebase_project_id=${{ secrets.PRODUCTION_NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            next_public_firebase_storage_bucket=${{ secrets.PRODUCTION_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            next_public_firebase_messaging_sender_id=${{ secrets.PRODUCTION_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            next_public_firebase_app_id=${{ secrets.PRODUCTION_NEXT_PUBLIC_FIREBASE_APP_ID }}
            next_public_firebase_measurement_id=${{ secrets.PRODUCTION_NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
            next_public_firebase_vapid_key=${{ secrets.PRODUCTION_NEXT_PUBLIC_FIREBASE_VAPID_KEY }}

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push "$ECR_REGISTRY/bikenwebocto-crypto/emp-perk-platform:${{ github.sha }}"
          docker push "$ECR_REGISTRY/bikenwebocto-crypto/emp-perk-platform:production-latest"

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:staging-latest"
